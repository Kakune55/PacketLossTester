<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络丢包率测试</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <main class="card">
        <header class="header">
            <h1>网络丢包率测试</h1>
            <div class="header-links">
                <a class="back-link" href="/speedtest.html">网络测速</a>
                <a class="back-link" href="/ipinfo.html">IP 信息</a>
            </div>
        </header>
        <section class="form-grid">
            <div class="form-group">
                <label for="frequency">每秒发送的数据包数量</label>
                <div class="range-container">
                    <input type="range" id="frequency" min="1" max="256" value="32">
                    <input type="number" class="range-input" id="frequency-input" min="1" max="256" value="32">
                </div>
            </div>
            <div class="form-group">
                <label for="size">数据包大小 (字节)</label>
                <div class="range-container">
                    <input type="range" id="size" min="1" max="16384" value="1024">
                    <input type="number" class="range-input" id="size-input" min="1" max="16384" value="1024">
                </div>
            </div>
            <div class="form-group">
                <label for="duration">持续时间 (秒)</label>
                <div class="range-container">
                    <input type="range" id="duration" min="1" max="300" value="10">
                    <input type="number" class="range-input" id="duration-input" min="1" max="300" value="10">
                </div>
            </div>
        </section>
        <section class="interactive-layout">
            <div id="stats">
                <div class="stats-row--plain"><span class="stats-label">发送的数据包数量:</span><span class="stats-value" id="sent-packets">0</span></div>
                <div class="stats-row--plain"><span class="stats-label">接收的数据包数量:</span><span class="stats-value" id="received-packets">0</span></div>
                <div class="stats-row--plain"><span class="stats-label">丢包率:</span><span class="stats-value" id="packet-loss-rate">0%</span></div>
                <div class="stats-divider"></div>
                <div><span class="stats-label">平均延迟:</span><span class="stats-value" id="avg-latency">-</span><span class="stats-unit">ms</span></div>
                <div><span class="stats-label">最小延迟:</span><span class="stats-value" id="min-latency">-</span><span class="stats-unit">ms</span></div>
                <div><span class="stats-label">最大延迟:</span><span class="stats-value" id="max-latency">-</span><span class="stats-unit">ms</span></div>
                <div><span class="stats-label">前10%延迟:</span><span class="stats-value" id="p90-latency">-</span><span class="stats-unit">ms</span></div>
                <div><span class="stats-label">抖动(Jitter):</span><span class="stats-value" id="jitter">-</span><span class="stats-unit">ms</span></div>
            </div>
            <div class="control-container">
                <div class="checkbox-group">
                    <input type="checkbox" id="stress-mode">
                    <label for="stress-mode">压测模式（无限期测试，保留10秒滚动数据）</label>
                </div>
                <div class="form-group">
                    <label for="preset">测试预设</label>
                    <select id="preset">
                        <!-- 从 presets.json 动态加载 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="testNode">测试节点</label>
                    <select id="testNode">
                        <!-- Populate with nodes -->
                    </select>
                </div>
                <div class="control-stack">
                    <div class="button-group">
                        <button id="start-btn">开始测试</button>
                        <button id="stop-btn">停止测试</button>
                    </div>
                    <div id="status" class="status-banner status-banner--compact">状态: 就绪</div>
                </div>
            </div>
        </section>
        <section id="chart-container">
            <canvas id="chart" width="600" height="300"></canvas>
        </section>
        <footer class="footer">
            <p>PacketLossTester | <a href="https://github.com/Kakune55/PacketLossTester">GitHub</a></p>
        </footer>
    </main>
    <script src="/js/chart.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
